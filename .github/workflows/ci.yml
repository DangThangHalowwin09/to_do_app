name: CI

on:
  push:
    branches: [master, main, 'claude/optimistic-carson-tqoubf'] # nhánh claude/... là TẠM THỜI
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Phải khớp phiên bản Flutter bạn dùng trên máy (flutter --version). pubspec.lock yêu cầu >= 3.35.
  FLUTTER_VERSION: 3.35.7

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
