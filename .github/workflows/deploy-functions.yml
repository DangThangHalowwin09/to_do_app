name: Deploy Cloud Functions

on:
  push:
    branches: [master, main]
    paths: ['functions/**', 'firebase.json']
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and test
        working-directory: functions
        run: |
          npm ci
          npm test

      # Khoá service account (JSON) lưu ở GitHub Secrets → FIREBASE_SERVICE_ACCOUNT.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: npx --yes firebase-tools@latest deploy --only functions --project "$(jq -r '.projects.default' .firebaserc)" --non-interactive
