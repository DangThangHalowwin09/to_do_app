name: Build Android

# Chạy tay (Actions → Build Android → Run workflow) hoặc khi đẩy tag dạng v1.2.3.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # TẠM THỜI: build mỗi lần đẩy lên nhánh làm việc này (xoá dòng dưới sau khi đã merge).
    branches: ['claude/optimistic-carson-tqoubf']

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # cần để đăng bản build lên mục Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ký bản release bằng keystore lưu trong GitHub Secrets (nếu đã cấu hình).
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 → build bằng khoá debug, KHÔNG dùng để phát hành."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      # Kiểm tra APK hợp lệ trước khi tải lên: zip nguyên vẹn, có chữ ký, đọc được manifest.
      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"
          unzip -tq "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -8
          "$BT/aapt" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"

      # Đăng APK lên Releases (bản "pre-release") để có link tải trực tiếp, không bị nén zip.
      # Chỉ chạy khi đẩy lên nhánh, không chạy khi chạy tay hoặc đẩy tag (tag tự là bản phát hành).
      - name: Publish preview release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "ubna-manager-$TAG.apk"
          gh release create "$TAG" "ubna-manager-$TAG.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Bản thử $TAG" \
            --notes "Bản build thử từ commit ${{ github.sha }}. Ký bằng khoá debug, chỉ dùng để kiểm tra."

      # Gói riêng chỉ chứa APK (nhẹ, để cài thử trên điện thoại).
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
